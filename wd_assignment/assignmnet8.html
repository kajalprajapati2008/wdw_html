<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <p>Links demo</p>

    <!-- External Link -->
    <a href="https://www.google.com" target="_blank">
        External link
    </a>
    <br>

    <!-- Internal Link -->
    <a href="#bottom">Jump to bottom</a>
    <br>

    <!-- Email Link -->
    <a href="mailto:example@gmail.com">Email us</a>
    <br>

    <!-- Image Link -->
    <a href="https://www.google.com">
        Logo
        <br>
        <img src="logo.png" alt="Logo" width="80" height="40">
    </a>

    <div style="height: 500px;"></div>

    <p id="bottom">
        Bottom. <a href="#">Back to top</a>
    </p>

</body>
</html>
